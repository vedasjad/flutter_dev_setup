name: flutter_dev_setup_example
description: Restores the saved dev server URL at startup, shows the developer setup screen in debug builds, and reads the device position through the mock location.
publish_to: none

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_dev_setup:
    path: ../
  geolocator: ^14.0.2
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
