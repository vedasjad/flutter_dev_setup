name: flutter_dev_setup
description: >-
  A developer setup screen for Flutter apps: find dev servers on the local
  network, switch the API base URL at runtime, and mock the device location.
version: 0.3.0
repository: https://github.com/vedasjad/flutter_dev_setup
issue_tracker: https://github.com/vedasjad/flutter_dev_setup/issues

topics:
  - developer-tools
  - networking
  - debugging
  - location
  - testing

screenshots:
  - description: Connected to a dev server found on the local network, named and pinned.
    path: screenshots/connected.webp
  - description: Scanning the local network for dev servers.
    path: screenshots/scanning.webp
  - description: Naming a server so the list shows a label instead of its address.
    path: screenshots/rename_server.webp
  - description: Adding a server the scan can't reach, such as a VPN or tunnel address.
    path: screenshots/add_server.webp
  - description: Mocking the location along a road route built from a shared Google Maps link.
    path: screenshots/mock_route.webp
  - description: Searching places near a mocked point, with free OpenStreetMap search.
    path: screenshots/mock_point.webp
  - description: The setup screen's mock location card, showing a route in progress.
    path: screenshots/mock_card.webp

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  device_info_plus: ">=12.0.0 <14.0.0"
  shared_preferences: ^2.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: ^2.4.1
